[workspace]
resolver = "2"
members = ["crates/engine", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
safetensors = "0.5.2"
hf-hub = "0.4.3"
anyhow = "1.0"
thiserror = "2.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
byteorder = "1.5"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.11"
regex = "1"
rubato = "0.14.1"
lenient_semver = "0.4.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
