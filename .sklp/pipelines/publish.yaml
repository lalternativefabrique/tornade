version: 1
kind: pipeline
name: publish
space: false

registry:
  provider: scaleway

tag:
  strategy: date-sha

on:
  branches: [main]
  clean_tree: true

scopes:
  app:
    - "cmd/**"
    - "internal/**"
    - "go.mod"
    - "go.sum"
    - "Dockerfile"

steps:
  - name: app-image
    kind: publish
    scope: [app]
    context: .
    dockerfile: Dockerfile
    image: rg.fr-par.scw.cloud/lalternative/tornade
    tag: "{{ publish_tag }}"
