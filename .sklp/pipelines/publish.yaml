version: 1
kind: pipeline
name: publish
space: false

registry:
  provider: scaleway

tag:
  strategy: date-sha

on:
  branches: [main]
  clean_tree: true

scopes:
  app:
    - "apps/core/**"
    - "client/**"
    - "signed/**"
    - "go.work"
    - "go.mod"
    - "go.sum"
    - "Dockerfile"
  web:
    - "apps/web/**"
    - "lib/front/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "Dockerfile.web"

steps:
  - name: app-image
    kind: publish
    scope: [app]
    context: .
    dockerfile: Dockerfile
    image: rg.fr-par.scw.cloud/lalternative/tornade
    tag: "{{ publish_tag }}"

  - name: web-image
    kind: publish
    scope: [web]
    context: .
    dockerfile: Dockerfile.web
    image: rg.fr-par.scw.cloud/lalternative/tornade-web
    tag: "{{ publish_tag }}"
