version: 1
kind: pipeline
name: ci

tools:
  go: "1.26.0"
  node: "24.16.0"
  pnpm: "10.27.0"
  rust: "1.93.0"

on:
  branches: ['**', '!main']

scopes:
  facade:
    - "apps/core/**"
    - "client/**"
    - "signed/**"
    - "go.work"
    - "go.mod"
    - "go.sum"
    - "Dockerfile"
  migrate:
    - "apps/migrations/**"
  render:
    - "render/**"
  web:
    - "apps/web/**"
    - "lib/front/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  tts:
    - "apps/tts/**"
    - "Dockerfile.tts"

steps:
  - name: facade-test
    scope: [facade]
    tools: [go]
    run: |
      go build ./... ./apps/core/...
      go vet ./... ./apps/core/...
      go test ./... ./apps/core/...

  - name: migrate-check
    scope: [migrate]
    workdir: apps/migrations
    run: |
      for up in *.up.sql; do
        test -f "${up%.up.sql}.down.sql" || { echo "missing down for $up"; exit 1; }
      done

  - name: render-test
    scope: [render]
    tools: [node]
    workdir: render
    run: |
      npm install
      npm test

  - name: web-check
    scope: [web]
    tools: [node, pnpm]
    run: |
      pnpm install --frozen-lockfile
      pnpm --filter @tornade/web lint
      pnpm --filter @tornade/web typecheck
      pnpm --filter @tornade/web test

  - name: tts-test
    scope: [tts]
    tools: [rust]
    run: |
      cd apps/tts
      cargo build --release --workspace
      cargo test --release --workspace
