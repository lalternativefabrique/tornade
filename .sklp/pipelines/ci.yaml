version: 1
kind: pipeline
name: ci

tools:
  go: "1.26.0"
  node: "24.16.0"

on:
  branches: ['**', '!main']

scopes:
  facade:
    - "apps/core/**"
    - "client/**"
    - "signed/**"
    - "go.work"
    - "go.mod"
    - "go.sum"
    - "Dockerfile"
  render:
    - "render/**"

steps:
  - name: facade-test
    scope: [facade]
    tools: [go]
    run: |
      go build ./... ./apps/core/...
      go vet ./... ./apps/core/...
      go test ./... ./apps/core/...

  - name: render-test
    scope: [render]
    tools: [node]
    workdir: render
    run: |
      npm install
      npm test
