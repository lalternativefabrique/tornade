# What runs on the node.
#
#   sklp deploy prod        bring the space up
#   sklp deploy ls          what is running
#   sklp deploy logs app    what it is saying
#
# The published image is pinned by an immutable date-sha tag; bump it here to
# roll a version. Nothing reads `latest`.
#
# No gateway route: tornade is consumed in-cluster by lalter and synthiz over
# the space's internal DNS (http://app:8080 inside this space), the same way
# Synthiz's own SearXNG is never exposed publicly. See README.md for how a
# caller in a different space reaches it.
version: 1
kind: deploy
name: prod
registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

services:
  app:
    image: rg.fr-par.scw.cloud/lalternative/tornade:20260831-0805-8aa82bdd5799
    port: 8080
    # A render can hold 300-500MB+ of Chromium per active request; the cap is
    # generous rather than tight because an OOM kill here drops whatever page
    # was mid-render, not just this request's memory. Search and speech are
    # thin by comparison — they ride along with the browser's budget.
    resources:
      cpu: 1
      memory: 1536Mi
    # SEARXNG_URL and PIPER_URL must point at the instances this node reaches;
    # an endpoint whose backend is unset answers 503 rather than failing at
    # startup, so a missing value shows up as a dead endpoint, not a crash.
    env:
      SEARXNG_URL: ${SEARXNG_URL}
      PIPER_URL: ${PIPER_URL}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TTS_VOICE: fr_FR-siwis-medium
      TTS_MODEL: fr_FR-siwis-medium
    ready:
      http: http://localhost:8080/healthz
      timeout: 60s

spaces:
  tornade-production: {}
