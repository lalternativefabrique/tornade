version: 1
kind: deploy
name: tornade

registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

services:
  postgres:
    image: postgres:16-alpine
    port: 5432
    env:
      POSTGRES_USER: tornade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tornade
    volumes: ["tornade-pg-data:/var/lib/postgresql/data"]
    ready:
      tcp: "5432"
      timeout: 60s

  app:
    image: rg.fr-par.scw.cloud/lalternative/tornade:20260901-0555-ee5332ac9518
    port: 8080
    depends_on: [postgres]
    env:
      LISTEN_ADDR: ":8080"
      # The registry of applications and the admin's accounts. Both live
      # here; the speak guard reads the keys from it at request time.
      DATABASE_URL: postgres://tornade:${POSTGRES_PASSWORD}@postgres:5432/tornade?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      # Seals the applications' keys at rest: base64 of 32 random bytes.
      REGISTRY_ENCRYPTION_KEY: ${REGISTRY_ENCRYPTION_KEY}
      SEARXNG_URL: http://searxng.searxng-production.internal
      PIPER_URL: http://piper.piper-production.internal
      TTS_MODEL: fr_FR-siwis-medium
      TTS_VOICE: fr_FR-siwis-medium
      S3_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      S3_REGION: gra
      S3_BUCKET: tornade-prod-audio
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # The residential endpoint /fetch reads through. A publisher behind bot
      # management refuses a datacenter address whatever headers the request
      # carries, so without it /fetch is turned away by a growing share of
      # the web it exists to read. Unset, the fetch goes direct and tornade
      # says so at startup.
      FETCH_PROXY: ${FETCH_PROXY}
    resources:
      cpu: "1"
      memory: 1536M
    ready:
      http: /healthz
      timeout: 60s

  # The admin web app: registers, rotates and revokes the applications that
  # speak through tornade. It reaches the app only through its own proxy,
  # minting the JWT the admin API verifies from the Better Auth session.
  web:
    image: rg.fr-par.scw.cloud/lalternative/tornade-web:20260909-0000-000000000000
    port: 5273
    depends_on: [postgres, app]
    env:
      PORT: "5273"
      NODE_ENV: production
      DATABASE_URL: postgres://tornade:${POSTGRES_PASSWORD}@postgres:5432/tornade?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://vvaves.dev
      JWT_SECRET: ${JWT_SECRET}
      CORE_API_URL: http://app:8080
      # /admin/setup mints the first admin with no session. The token rides
      # in the URL the operator is handed, ?token=; without it, production
      # refuses every setup rather than letting whoever comes first in.
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN}
    resources:
      cpu: "0.5"
      memory: 512M
    ready:
      http: /admin/login
      timeout: 120s

spaces:
  tornade-production:
    gateway:
      routes:
        # Public for the one endpoint a browser has business calling.
        #
        # /render and /fetch execute third-party JavaScript against a URL the
        # caller picks, which on the open internet is an SSRF offered to
        # anyone: every service on the node, and the metadata endpoint, a
        # request away. /search would hand out the SearXNG instance and the
        # Brave quota. Nothing routes what is not listed here, so the
        # omission is the control.
        #
        # The front door matches a path by PREFIX, so this entry also reaches
        # /speak/prime and /speak/pregenerate. That is why a signature is
        # accepted on /speak alone (httpapi.guardSpeak): those two start a
        # synthesis nobody is waiting for, and only a service holding a key
        # may ask for it.
        #
        # `expensive` because a miss occupies the voice, and Piper reads one
        # utterance at a time: a burst here is a queue in front of whoever
        # pressed play.
        #
        # The host is written here rather than interpolated from a project
        # secret: it is a public name, in the DNS, the certificate and every
        # request a browser makes, and keeping it out of the repo only made
        # the deployment fail for a reason that had nothing to do with a
        # credential. It is tornade's own name, not one application's: every
        # app that reads aloud sends its listeners here, and the signature's
        # issuer is what tells them apart.
        - service: app
          host: vvaves.dev
          path: /speak
          kind: expensive
          security_headers: true
          # A reading streams for as long as it takes to synthesize, which on
          # a long reply is minutes. A timeout would cut the audio mid-word
          # with the 200 already committed, so the response could not even
          # report why it stopped.
          timeout: "0"
          # A whole article is a legitimate body here, and the handler already
          # bounds it at 4MB itself — a cap declared here too would only be a
          # second number to keep in step.
        # Everything else on the name is the admin. /speak stays the app's:
        # the front door matches the longest prefix first.
        - service: web
          host: vvaves.dev
          path: /
          security_headers: true
