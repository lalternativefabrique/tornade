version: 1
kind: deploy
name: tornade

registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

services:
  app:
    image: rg.fr-par.scw.cloud/lalternative/tornade:20260901-0555-ee5332ac9518
    port: 8080
    env:
      LISTEN_ADDR: ":8080"
      SEARXNG_URL: http://searxng.searxng-production.internal
      PIPER_URL: http://piper.piper-production.internal
      TTS_MODEL: fr_FR-siwis-medium
      TTS_VOICE: fr_FR-siwis-medium
      S3_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      S3_REGION: gra
      S3_BUCKET: tornade-prod-audio
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SPEAK_SIGNING_KEYS: ${SPEAK_SIGNING_KEYS}
      SPEAK_APP_KEYS: ${SPEAK_APP_KEYS}
    resources:
      cpu: "1"
      memory: 1536M
    ready:
      http: /healthz
      timeout: 60s

spaces:
  tornade-production: {}
