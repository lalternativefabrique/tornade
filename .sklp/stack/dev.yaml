version: 1
kind: devstack
name: dev

# The whole platform on one machine: the deployments of .sklp/deploy-root.yaml
# (app, tts, searxng+redis) in a single space, reached by service name exactly
# as in production.
env_files:
  - .env

services:
  redis:
    image: redis:7-alpine
    network: bridge
    port: 6379
    command: ["redis-server", "--save", "60", "1"]
    volumes: ["sklp-dev-redis-data:/data"]
    ready:
      tcp: "6379"
      timeout: 60s

  # The stock image only serves HTML; the search client asks for JSON, which
  # SearXNG refuses (403) unless the format is enabled in settings.yml. The
  # image has no env override for it, so the file is written into the config
  # volume before searxng starts.
  searxng-config:
    image: alpine:3.21
    network: bridge
    oneshot: true
    volumes: ["sklp-dev-searxng-config:/etc/searxng"]
    command:
      - sh
      - -c
      - |
        cat > /etc/searxng/settings.yml <<'YAML'
        use_default_settings: true
        server:
          limiter: false
        search:
          default_lang: "fr"
          formats:
            - html
            - json
        YAML

  # 8888, not the image's 8080: a service's host ingress is bound on its own
  # container port, and the app already owns 8080.
  searxng:
    image: docker.io/searxng/searxng@sha256:e45d5894bfaa0bf8773b9f283795ae57f1c15ddb29c8cecb70b3665b0ce9ec60
    network: bridge
    port: 8888
    depends_on: [redis, searxng-config]
    volumes: ["sklp-dev-searxng-config:/etc/searxng"]
    env:
      SEARXNG_PORT: "8888"
      SEARXNG_BASE_URL: http://searxng:8888
      SEARXNG_REDIS_URL: redis://redis:6379/0
      SEARXNG_SECRET: dev-only-searxng-secret
    ready:
      http: /healthz
      timeout: 120s

  # Built from source like the app: the image only exists once publish has
  # run on main. The model weights are fetched from Hugging Face on first
  # start and kept in the named volume.
  tts:
    run: cargo run --release -p tornade-tts
    workdir: apps/tts
    port: 5000
    volumes: ["sklp-dev-tts-hf:/root/.cache/huggingface"]
    env:
      LISTEN_ADDR: 0.0.0.0:5000
      TTS_MODEL: french_24l
      TTS_LIVE_SLOTS: "8"
      TTS_BACKGROUND_SLOTS: "2"
    ready:
      http: /healthz
      timeout: 900s

  postgres:
    image: postgres:16-alpine
    network: bridge
    port: 5432
    env:
      POSTGRES_USER: tornade
      POSTGRES_PASSWORD: tornade
      POSTGRES_DB: tornade
    volumes: ["sklp-dev-tornade-pg:/var/lib/postgresql/data"]
    ready:
      tcp: postgres:5432
      timeout: 30s

  # Applies apps/migrations before the app opens a connection. Production runs
  # the same files from the migrate image (apps/migrations/Dockerfile); the dev
  # stack has no image step, so the tool is fetched by `go run`.
  migrate:
    workdir: apps/migrations
    oneshot: true
    depends_on: [postgres]
    env:
      DATABASE_URL: postgres://tornade:tornade@postgres:5432/tornade?sslmode=disable
    run: >-
      go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      -path . -database "$DATABASE_URL" up

  app:
    run: go run .
    workdir: apps/core
    port: 8080
    depends_on: [searxng, postgres, migrate, tts]
    env:
      SEARXNG_URL: http://searxng:8888
      PIPER_URL: http://tts:5000
      TTS_MODEL: french_24l
      TTS_VOICE: estelle
      TTS_MAX_CHARS: "600"
      CHROMIUM_PATH: /usr/bin/chromium
      SPEAK_UNGUARDED: "true"
      DATABASE_URL: postgres://tornade:tornade@postgres:5432/tornade?sslmode=disable
      JWT_SECRET: dev-only-jwt-secret
      REGISTRY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ready:
      http: /healthz
      timeout: 120s

  # The admin: who may speak through tornade. Better Auth owns the accounts in
  # the same Postgres; the app only ever reaches tornade through its proxy.
  web:
    run: pnpm install --frozen-lockfile && pnpm --filter @tornade/web dev
    port: 5273
    depends_on: [app]
    env:
      DATABASE_URL: postgres://tornade:tornade@postgres:5432/tornade?sslmode=disable
      BETTER_AUTH_SECRET: dev-only-better-auth-secret
      BETTER_AUTH_URL: http://localhost:5273
      JWT_SECRET: dev-only-jwt-secret
      CORE_API_URL: http://app:8080
      PORT: "5273"
    ready:
      http: /admin/login
      timeout: 300s
