runner:
  registry: rg.fr-par.scw.cloud/lalternative
  registry_auth_secret: scw-registry-credentials

  toolchain:
    go: "1.26.0"
    node: "24.16.0"
    pnpm: "10.27.0"

  packages:
    - git
    - ca-certificates
    - curl
    # /render drives a browser: chromedp only needs the binary, the flags it
    # passes (no-sandbox, no /dev/shm) already fit a container.
    - chromium
    # apps/tts: rustc links through cc, and the server encodes mp3 with the
    # system LAME.
    - build-essential
    - libmp3lame-dev
