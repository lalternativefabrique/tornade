# The residential endpoint /fetch reads through.
#
# A publisher behind bot management refuses this cluster's egress address
# whatever headers the request carries — verified against lepoint.fr, where a
# browser User-Agent from inside the cluster is refused exactly like an honest
# one. No header, cookie or delay lifts a verdict reached on the IP, so a
# residential exit is the only thing that changes the answer.
#
# The whole value is a credential: it carries "user:password@host". It lives
# in the same Scaleway entry as the audio keys rather than one of its own,
# since it belongs to the same deployment and is rotated by the same hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tornade-fetch-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: tornade-fetch-proxy
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        FETCH_PROXY: "{{ .FETCH_PROXY }}"
  dataFrom:
    - extract:
        key: path:/tornade/tornade-production
