apiVersion: v1
kind: Service
metadata:
  name: tornade
  labels:
    app: tornade
spec:
  type: ClusterIP
  selector:
    app: tornade
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tornade
  labels:
    app: tornade
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tornade
  template:
    metadata:
      labels:
        app: tornade
    spec:
      imagePullSecrets:
        - name: scw-registry-credentials
      containers:
        - name: tornade
          image: rg.fr-par.scw.cloud/lalternative/tornade
          imagePullPolicy: IfNotPresent
          env:
            # searxng and piper live in synthiz's `ai` namespace, so they are
            # addressed across it rather than by bare service name.
            - name: SEARXNG_URL
              value: http://searxng.ai.svc.cluster.local:8080
            - name: PIPER_URL
              value: http://piper.ai.svc.cluster.local:5000
            - name: TTS_MODEL
              value: fr_FR-siwis-medium
            - name: TTS_VOICE
              value: fr_FR-siwis-medium
            # OVH, bucket tornade-prod-audio: where a finished reading is
            # kept so the same text is never read twice, and where an opening
            # read ahead of time waits for the listener who presses play.
            #
            # optional, and marked so: absent, tornade reads text aloud as it
            # did before there was a bucket — every reading simply paid for
            # again — rather than failing to start.
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: tornade-audio-creds
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: tornade-audio-creds
                  key: S3_REGION
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: tornade-audio-creds
                  key: S3_BUCKET
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tornade-audio-creds
                  key: S3_ACCESS_KEY
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tornade-audio-creds
                  key: S3_SECRET_KEY
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            # A render holds 300-500MB+ of Chromium while it runs, and the
            # limit is generous rather than tight because an OOM kill here
            # drops whatever page was mid-render, not just this request's
            # memory. Search and speech are thin by comparison — they ride
            # along with the browser's budget.
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # Chromium writes its shared memory here; the container's default
            # /dev/shm is 64Mi, which a real page blows through.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
