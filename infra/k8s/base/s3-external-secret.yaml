# S3 credentials for the readings tornade keeps, so the same text is never
# sent to Piper twice and an opening can be read before anyone presses play.
#
# Only the two keys: the endpoint, the region and the bucket name are not
# credentials, and are set on the deployment itself. The bucket they reach is
# tornade-prod-audio, declared in kube-infra's OvhBucketsV1Stack alongside the
# OVH user whose IAM policy reaches it and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tornade-audio-creds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: tornade-audio-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: path:/tornade/tornade-production
