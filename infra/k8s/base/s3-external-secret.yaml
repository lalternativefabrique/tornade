# S3 credentials and bucket coordinates for the readings tornade keeps, so the
# same text is never sent to Piper twice and an opening can be read before
# anyone presses play.
#
# Read from the Scaleway "tornade-production" secret, which holds the keys of
# the OVH user scoped to tornade-prod-audio (declared in kube-infra's
# OvhBucketsV1Stack).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tornade-audio-creds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: tornade-audio-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_REGION: "{{ .S3_REGION }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: path:/tornade/tornade-production
