apiVersion: v1
kind: Service
metadata:
  name: piper
  labels:
    app: piper
spec:
  type: ClusterIP
  selector:
    app: piper
  ports:
    - name: http
      port: 5000
      targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  labels:
    app: piper
spec:
  # One replica, not two. A ClusterIP spreads by connection and the Go client
  # keeps a pool, so several pieces of one reading ride the same connections to
  # the same pod anyway — the second replica took no share of the work while
  # holding CPU that the first could have used. Speech synthesis is compute:
  # what makes a reading faster is cores behind one pod, not pods.
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      # Named here rather than left to the default ServiceAccount. That
      # account carries the same secret, but only because a Terraform run
      # patched it once — a patch that does not replay when the namespace is
      # recreated, which is how this image became unpullable the moment the
      # namespace was rebuilt from these manifests. Stating it on the pod
      # makes the namespace reproducible from what is committed here.
      #
      # Only piper needs it: searxng and redis come from public registries.
      imagePullSecrets:
        - name: scw-registry-credentials
      containers:
        - name: piper
          image: rg.fr-par.scw.cloud/synthiz/piper-server:20260829-1639-33b17b97ecb6
          imagePullPolicy: IfNotPresent
          env:
            # medium over low: measured RTF ~0.37 on this cluster's CPU
            # (nearly 3x faster than real time), so the quality step up from
            # low's 16kHz costs nothing in practice. Streaming (this service,
            # unlike the wrapper it replaces) is what actually kept the first
            # low-quality voice choice feeling fast — with real streaming the
            # network size stopped being the latency driver.
            - name: DEFAULT_VOICE
              value: fr_FR-siwis-medium
          ports:
            - containerPort: 5000
              name: http
          livenessProbe:
            httpGet:
              path: /docs
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /docs
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            # A reading arrives as several pieces at once and they share
            # whatever is here, so a limit of 2 had them taking turns rather
            # than running side by side. Three rather than four: a pod lives
            # entirely on one node, the nodes here have 3.8 cores each, and
            # twenty-odd other pods need some of that too.
            limits:
              cpu: "3"
              memory: 4Gi
          volumeMounts:
            - name: piper-data
              mountPath: /app/data
      volumes:
        - name: piper-data
          emptyDir: {}
