# Secret material for the ai namespace (searxng, and any later ai workload).
# Sourced from the SCW Secret Manager key/value entry "ai-production" under the
# "/ai" path, filled by hand.
#
# It is a namespace-scoped entry on purpose: a Kubernetes Secret never crosses
# namespaces, so an ExternalSecret living in tornade-prod cannot serve the ai
# namespace. Both read the same ClusterSecretStore, but the Secrets they
# materialise are independent objects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: ai-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        SEARXNG_SECRET: "{{ .SEARXNG_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: path:/ai/ai-production
