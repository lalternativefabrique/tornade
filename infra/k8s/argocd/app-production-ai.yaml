# The ai namespace: searxng, piper, and the redis searxng caches into.
#
# It moved here from synthiz, which used to own it. tornade is the service
# built on top of these two — it is the reason they run at all — and synthiz
# now reaches them the same way any other caller does, by their cluster DNS
# names. Those names did not change with the move, so nothing that called them
# had to be touched.
#
# The namespace keeps its own ResourceQuota: a headless browser holds well
# over a gigabyte while it renders, and that budget has to be visible next to
# the workloads it covers rather than folded into another product's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tornade-production-ai
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lalternativefabrique/tornade.git
    targetRevision: main
    path: infra/k8s/overlays/production-ai
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
