apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tornade-production
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: tornade=rg.fr-par.scw.cloud/lalternative/tornade
    argocd-image-updater.argoproj.io/tornade.kustomize.image-name: rg.fr-par.scw.cloud/lalternative/tornade
    argocd-image-updater.argoproj.io/tornade.update-strategy: alphabetical
    argocd-image-updater.argoproj.io/tornade.allow-tags: regexp:^[0-9]{8}-[0-9]{4}-[0-9a-f]+$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lalternativefabrique/tornade.git
    targetRevision: main
    path: infra/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: tornade-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
